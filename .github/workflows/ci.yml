name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and API tests
        run: pnpm test
      - name: Build
        run: pnpm build
        env:
          # Placeholders so route modules can load at build time; no real services are called.
          NEON_AUTH_BASE_URL: https://auth.example.invalid/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-build-only-not-a-real-secret-0123456789
